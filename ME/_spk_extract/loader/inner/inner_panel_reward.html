<div .panel name="panel-reward">
    <frameset rows="2*,*" style="width:100%%;height:100%%;">
        <widget .querytable #t_qu_reward type="tablectrl" head="reward" data-name="reward"></widget>
        <div .action .content>
            <ul .interact>
                <button #t_btn_add_reward onClick="addReward();">新增奖励</button>
                <button #t_btn_copy_reward disabled onClick="copyReward();">复制奖励</button>
                <button #t_btn_detail_reward disabled onClick="detailReward();">详情编辑</button>
                <span style="display:inline-block;width:100%%"></span>
                <button #t_btn_up_reward disabled onClick="updateReward();">更新信息</button>
                <button #t_btn_del_reward disabled onClick="deleteReward();">删除信息</button>
                <table .detail>
                    <tr>
                        <td>奖励ID：</td>
                        <td #t_reward_id></td>
                    </tr>
                    <tr>
                        <td>名称：</td>
                        <td><input #t_reward_name type="text" size=20 /> </td>
                    </tr>
                    <tr>
                        <td>类型：</td>
                        <td #t_reward_type></td>
                    </tr>
                    <tr>
                        <td>备注：</td>
                        <td><textarea #t_reward_note rows=2 style="width:100%%;" /></td></tr>
                </table>
            </ul>
        </div>
    </frameset>
</div>

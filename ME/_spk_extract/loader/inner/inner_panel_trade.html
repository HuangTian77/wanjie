<div .panel name="panel-trade">
    <frameset rows="2*,*" style="width:100%%;height:100%%;">
        <widget .querytable #t_qu_trade type="tablectrl" head="trade" data-name="trade"></widget>
        <div .action .content>
            <ul .interact>
                <button #t_btn_add_trade onClick="addTrade();">新增交易</button>
                <button #t_btn_edit_trade disabled onClick="editTrade();">交易编辑</button>
                <span style="display:inline-block;width:100%%"></span>
                <button #t_btn_up_trade disabled onClick="updateTrade();">更新数据</button>
                <button #t_btn_del_trade disabled onClick="deleteTrade();">删除交易</button>
                <table .detail>
                    <tr>
                        <td>ID：</td><td #t_trade_id></td>
                    </tr>
                    <tr>
                        <td>名称：</td><td><input #t_trade_name type="text" size=20 /> </td>
                    </tr>
                    <tr>
                        <td>类型：</td><td #t_trade_type></td>
                    </tr>
                    <tr>
                        <td>描述：</td><td><textarea #t_trade_desc rows=5 style="width:100%%;" /> </td>
                    </tr>
                    <tr>
                        <td>备注：</td><td><textarea #t_trade_note rows=5 style="width:100%%;" /></td></tr>
                </table>
            </ul>
        </div>
    </frameset>
</div>

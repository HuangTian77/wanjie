<!doctype html>
<html lang="en">

<head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">

    <title>自定义数据编辑</title>
    <!-- css配置优先级：从上往下，优先级越高 -->
    <!-- 全局配置  -->
    <style src="bundle://res/master.css" />
    <!-- 基本css  -->
    <style src='../css/common.css' />
    <!-- 当前页面CSS配置 -->
    <style>
        .bottom_button {
            margin-top: 5px;
        }

        .bottom_button button {
            width: 100px;
        }

        .board {
            width: 100%%;
            height: 100%%;
        }

        widget[type='scintilla'] {
            -lexer-name: "";
            -show-line-number: 0;
        }
    </style>

    <!-- 公共脚本 -->
    <script type="text/lua" src="../common/utils.lua"></script>
    <script type="text/lua" src="../common/view.lua"></script>

    <!-- 当前页面脚本 -->
    <script type="text/lua" src="editcustomdata.lua"></script>
</head>

<body>
    <!-- <button onclick="clickTest();">测试</button> -->
    <table .detail-info>
        <tr>
            <td>键名：</td>
            <td #t_kname></td>
        </tr>
        <tr>
            <td>名称：</td>
            <td #t_name></td>
        </tr>
        <tr>
            <td>备注：</td>
            <td #t_note></td>
        </tr>
    </table>
    <div .board>
        数据类型：
        <span>
            <button checked type=radio v='text' k=0 onclick="clickTypeSelect()">文本</button>
            <button type=radio v='json' k=1 onclick="clickTypeSelect()">JSON</button>
        </span>
        <span style="display: none;">
            <button #t_btn_load onclick="clickLoadData()" title="第一行为表头，每一行的内容为数组模式">导入（数组）</button>
            <button #t_btn_load onclick="clickLoadData(1)" title="数据中的每一行是一个 key-value 结构，csv 中的表头就是对应列的 key，方便后续数据获取">导入（key-value）</button>
        </span>
        <widget #t_data type="scintilla" style="margin-top:5px;" />
    </div>
    <div .bottom_button>
        <button onClick="yes();">保存</button>
        <button onClick="no();">取消</button>
    </div>
</body>

</html>

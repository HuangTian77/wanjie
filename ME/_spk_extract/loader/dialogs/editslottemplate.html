<!doctype html>
<html lang="en">

<head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">

    <title>物品插槽属性模板编辑</title>
    <!-- css配置优先级：从上往下，优先级越高 -->
    <!-- 全局配置  -->
    <style src="bundle://res/master.css" />
    <!-- 基本css  -->
    <style src='../css/common.css' />
    <!-- 当前页面CSS配置 -->
    <style>
        .bottom_button {
            margin-top: 5px;
        }

        .bottom_button button {
            width: 100px;
        }

        ul {
            width: 100%%;
            height: 100%%;
            border: 1px solid silver;
            margin-top: 5px;
            margin-bottom: 0px;
            padding: 0;
            overflow-y: auto;
        }

        li {
            list-style: none;
            padding-left: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
        }

    </style>

    <!-- 公共脚本 -->
    <script type="text/lua" src="../common/utils.lua"></script>
    <script type="text/lua" src="../common/view.lua"></script>

    <!-- 插槽操作库 -->
    <script type="text/lua" src="bp://slot_ui.lua"></script>

    <!-- 当前页面脚本 -->
    <script type="text/lua" src="editslottemplate.lua"></script>
</head>

<body>
    <!-- <button onclick="clickTest();">测试</button> -->
    <table .detail-info>
        <tr>
            <td>模板名称：</td>
            <td #t_name></td>
        </tr>
        <tr>
            <td>模板ID：</td>
            <td #t_id></td>
        </tr>
        <tr>
            <td>模板备注：</td>
            <td #t_note></td>
        </tr>
    </table>
    <div style="width:100%%;height:100%%;">
        <button onclick="clickAddSlot();">增加插槽依赖</button>
        <ul #t_slot>
        </ul>
    </div>
    <div .bottom_button>
        <button onClick="yes();">保存</button>
        <button onClick="no();">取消</button>
    </div>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">

    <title>物品详情编辑</title>
    <!-- css配置优先级：从上往下，优先级越高 -->
    <!-- 全局配置  -->
    <style src="bundle://res/master.css" />
    <!-- 基本css  -->
    <style src='../css/common.css' />
    <style src='../css/tab.css' />
    <!-- 交互模块 css -->
    <style src='../css/alternation.css' />
    <!-- 当前页面CSS配置 -->
    <style>
        .bottom_button {
            margin-top: 5px;
        }

        .bottom_button button {
            width: 100px;
        }

        ul.cond {
            margin: 2px 0 2px 0;
            padding: 0 5px 0 0;
        }

        li {
            list-style: none;
            padding-left: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
        }

        /* 给 div 用的*/
        .board {
            width: 100%%;
            height: 100%%;
        }

        .sub-container {
            width: 60%%;
            height: 100%%;
        }

        .sub-container, .left {
            width: 50%%;
            margin-right: 5px;
        }
    </style>

    <style>
        .popup {
            margin-top: 3px;
            border: 1px solid silver;
            flow:h-flow;
            overflow-y: auto;
        }

        .popup div {
            display: block;
            behavior: check;
            min-width: 50px;
            margin: 2px;
            border: 1px solid silver;
            text-align: center;
            padding: 3px 10px;
            white-space: nowrap;
        }

        .popup div:checked {
            background-color: rgb(51, 125, 194);
            border-radius: 5px;
            border: 1px solid black;
            color: white;
        }

    </style>

    <!-- 公共脚本 -->
    <script type="text/lua" src="../common/utils.lua"></script>
    <script type="text/lua" src="../common/view.lua"></script>

    <!-- 条件触发的 ui 公共脚本-->
    <script type="text/lua" src="bp://trigger_ui.lua"></script>
    <script type="text/lua" src="bp://slot_ui.lua"></script>

    <!-- 当前页面脚本 -->
    <script type="text/lua" src="edititem.lua"></script>
</head>

<body>
    <!-- <button onClick="clickTest()">测试输出</button> -->
    <div .board>
        <table .detail-info>
            <tr>
                <td>物品：</td>
                <td #t_item_name></td>
            </tr>
            <tr>
                <td>分类：</td>
                <td #t_item_type></td>
            </tr>
            <tr>
                <td>特性：</td>
                <td #t_item_feature></td>
            </tr>
            <tr>
                <td>描述：</td>
                <td #t_item_desc></td>
            </tr>
            <!--
            <tr>
                <td>物品备注：</td>
                <td #t_item_note></td>
            </tr> -->
        </table>
        <div .tabs #t_tabs style="min-height: 120px;">
            <div .strip style="width:100%%;">
                <div #t_panel_interact selected panel="panel-interact">互动效果</div>
                <div #t_panel_consume panel="panel-consume">消耗效果</div>
                <div #t_panel_carry panel="panel-carry">携带效果</div>
                <div #t_panel_equip panel="panel-equip">装配效果</div>
                <div #t_panel_slot panel="panel-slot">插槽设置</div>
            </div>

            <!-- 互动效果 -->
            <div .panel name="panel-interact">
                <div #t_alternation_control .alternation-module style="flow:horizontal;height:100%%;">
                    <include src='./inner-alternation.html' />
                </div>
                <div .comment>互动效果就是在包裹中点击物品弹出的对话框中的可点击的互动按钮，比如：装备、使用、丢弃 等</div>
            </div>
            <!-- 消耗页面 -->
            <div .panel .item-level name="panel-consume">
                <div .tabs style="min-height: 120px;">
                    <div .strip style="width:100%%;">
                        <div selected panel="panel-effect">效果</div>
                        <div panel="panel-cond">条件</div>
                    </div>
                    <div .panel name="panel-effect">
                        <button onClick="clickAddEffect()">增加效果</button>
                        <ul tkey='container-property' name='consume' #t_consume .cond></ul>
                    </div>
                    <div .panel name="panel-cond">
                        <button onClick="clickAddCondition()">增加条件</button>
                        <select tkey='ops' size=1>
                            <option value=0>全部满足（与）</option>
                            <option value=1>满足一个（或）</option>
                        </select>
                        <ul tkey='container-condition' #t_consume_condition .cond></ul>
                    </div>
                </div>
                需要物品特性中支持『可消耗』才能使用本标签页下的功能，否则无效
            </div>
            <!-- 携带效果 -->
            <div .panel .item-level name="panel-carry">
                <div .tabs style="min-height: 120px;">
                    <div .strip style="width:100%%;">
                        <div selected panel="panel-effect">效果</div>
                        <div panel="panel-cond">条件</div>
                    </div>
                    <div .panel name="panel-effect">
                        <button onClick="clickAddEffect()">增加效果</button>
                        <ul tkey='container-property' #t_carry .cond></ul>
                    </div>
                    <div .panel name="panel-cond">
                        <button onClick="clickAddCondition()">增加条件</button>
                        <select tkey='ops' size=1>
                            <option value=0>全部满足（与）</option>
                            <option value=1>满足一个（或）</option>
                        </select>
                        <ul tkey='container-condition' #t_carry_condition .cond></ul>
                    </div>
                </div>
            </div>
            <!-- 装备效果 -->
            <div .panel .item-level name="panel-equip">
                <div .tabs style="min-height: 120px;">
                    <div .strip style="width:100%%;">
                        <div selected panel="panel-effect">效果</div>
                        <div panel="panel-cond">条件</div>
                    </div>
                    <div .panel name="panel-effect">
                        触发类型：<button type=radio v=0 checked onclick="clickRadioButton()">配置</button> <button type=radio
                            v=1 onclick="clickRadioButton()">脚本</button>
                        <div .board tkey=config-container>
                            <button onClick="clickAddEffect()">增加效果</button>
                            <ul tkey='container-property' #t_equip .cond></ul>
                        </div>
                        <div .board tkey=script-container style="display: none;">
                            <button onclick="clickCheckGrammar(this:find_nearest_parent('div'):F('widget').value)">语法校验</button>
                            <span .full-width></span>
                            <button title='可以把当前的脚本批量覆盖到对应选中的物品设置中，操作不可回退，慎用' onclick='clickEquipScriptBatchOverwrite();'>批量覆盖</button>
                            <widget tkey='property-script' #t_equip_script type=scintilla style='margin-top:3px;' />
                        </div>
                    </div>
                    <div .panel name="panel-cond">
                        <button onClick="clickAddCondition()">增加条件</button>
                        <select tkey='ops' size=1>
                            <option value=0>全部满足（与）</option>
                            <option value=1>满足一个（或）</option>
                        </select>
                        <ul tkey='container-condition' #t_equip_condition .cond></ul>
                    </div>
                </div>
                需要物品特性中支持『可装备』才能使用本标签页下的功能，否则无效
            </div>
            <!-- 槽位设置 -->
            <div .panel name="panel-slot">
                <div style="width:100%%;height:200px;padding-top:5px;padding-bottom:5px;">
                    模板选择<span .comment>可以到插槽模板页面增加模板</span>
                    <widget #t_template .slot-template .board type="select" style="flow:h-flow;"></widget>
                </div>
                <div style="height:100%%;overflow:hidden;">
                    <button onClick="clickAddSlot()">增加插槽设置</button>
                    <ul tkey='container' #t_slot .cond>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div .bottom_button>
        <button onClick="yes();">保存</button>
        <button onClick="no();">取消</button>
    </div>
    <popup #t_popup style="width:800px;height:600px;border:1px solid black;background-color: whitesmoke; padding: 5px;">
        <button onclick="clickPopupSelectAll(this:find_nearest_parent('popup'):F('widget'));">全选</button>
        <button onclick="clickPopupSelectReverse(this:find_nearest_parent('popup'):F('widget'));">反选</button>
        <span .full-width></span>
        <button onclick="clickPopupUnselectAll(this:find_nearest_parent('popup'):F('widget'));">清空</button>
        <widget .board .popup></widget>
        <div style="margin: 10px;">
            <span style="width:50%%; display:inline-block;"></span><button onclick="clickPopupConfirm();" style="padding: 5px;min-width:100px;">确定</button>
        </div>
    </popup>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">

    <title>充值选项配置编辑</title>
    <!-- css配置优先级：从上往下，优先级越高 -->
    <!-- 全局配置  -->
    <style src="bundle://res/master.css" />
    <!-- 基本css  -->
    <style src='../css/common.css' />
    <style src='../css/tab.css' />
    <!-- 当前页面CSS配置 -->
    <style>
        .bottom_button {
            margin-top: 5px;
        }

        .bottom_button button {
            width: 100px;
        }

        ul {
            border: 1px solid silver;
            margin: 5px 0 0 0;
            padding: 0;
            height: 100%%;
            width: 100%%;
            overflow: auto;
        }

        ul.token {
          background-color: #ddeeff;  
        }

        .board {
            width: 100%%;
            height: 100%%;
        }

        p:nth-child(1) {
            margin-top: 0;
        }
        
    </style>

    <!-- 公共脚本 -->
    <script type="text/lua" src="../common/utils.lua"></script>
    <script type="text/lua" src="../common/view.lua"></script>

    <script type="text/lua" src="bp://trigger_ui.lua"></script>

    <!-- 当前页面脚本 -->
    <script type="text/lua" src="editpayment.lua"></script>
</head>

<body>
    <!-- <button onclick="clickTest()">测试</button> -->
    <div .board>
        <table .detail-info>
            <tr>
                <td>名称：</td>
                <td #t_name></td>
            </tr>
            <tr>
                <td>价格：</td>
                <td #t_price></td>
            </tr>
            <tr>
                <td>描述：</td>
                <td #t_desc></td>
            </tr>
            <tr>
                <td>备注：</td>
                <td #t_note></td>
            </tr>
        </table>
        <div .board>
            <button onclick="clickAddContent(this:find_nearest_parent('div'):F('ul'));">增加内容</button>
            <span .full-width></span>
            <button onclick="this:find_nearest_parent('div'):F('ul').html=''">清空</button>
            <ul #t_result></ul>
        </div>
    </div>
    <div .bottom_button>
        <button onClick="yes();">保存</button>
        <button onClick="no();">取消</button>
    </div>
</body>

</html>

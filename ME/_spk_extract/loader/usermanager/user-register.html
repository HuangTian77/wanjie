<!doctype html>
<html lang="en">

<head>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta charset="UTF-8">

    <title>帐号注册</title>
    <!-- css配置优先级：从上往下，优先级越高 -->
    <!-- 全局配置  -->
    <style src="bundle://res/master.css" />
    <!-- 基本css  -->
    <style src="../css/common.css" />
    <!-- 当前页面CSS配置 -->
    <style>
        .board {
            width: 100%%;
            height: 100%%;
        }

        body {
            padding: 25%%;
        }

        table {
            width:100%%;
        }

        table td {
            padding-top: 5px;
        }

        table td:nth-child(1) {
            white-space: nowrap;
        }

        table td:nth-child(2) {
            width: 100%%;
        }

        fieldset {
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            margin-bottom:10px;
            height:100%%;
        }

        legend {
            font-weight: bold;
            color: black;
            margin: 0 auto;
        }
        
    </style>

    <!-- 公共脚本 -->
    <script type="text/lua" src="../common/utils.lua"></script>
    <script type="text/lua" src="../common/view.lua"></script>

    <!-- 当前页面脚本 -->
    <script type="text/lua" src="user-register.lua"></script>

</head>

<body>
    <div .board>
        <!-- <fieldset>
            <legend>注册信息</legend> -->
            <table>
                <tr>
                    <td>帐号：</td>
                    <td><input #t_account type=text value="" style="width: 100%%;" /></td>
                </tr>
                <tr>
                    <td>邮箱：</td>
                    <td><input #t_email type=text value="" style="width: 100%%;" /></td>
                </tr>
                <tr>
                    <td>昵称：</td>
                    <td><input #t_nickname type=text value="" style="width: 100%%;" /></td>
                </tr>
                <tr>
                    <td>密码：</td>
                    <td><input #t_password type=password value="" style="width: 100%%;" /></td>
                </tr>
                <tr>
                    <td>确认：</td>
                    <td><input #t_password2 type=password value="" style="width: 100%%;" /></td>
                </tr>

            </table>
        <!-- </fieldset> -->
        <br/>
        <br/>
        <button onclick="register();" style="width: 100%%;">注册</button>
    </div>
</body>

</html>
